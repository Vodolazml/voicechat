name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for audio and Qt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 libegl1 libxkbcommon0 >/dev/null
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-server.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit server dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-server.txt
      - name: Shell scripts parse
        run: bash -n deploy/install.sh
      - name: Production compose file is valid
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.prod.yml config >/dev/null
