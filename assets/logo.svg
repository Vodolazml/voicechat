<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- VoiceChat mark: five voice bars that together draw a "V". -->
  <defs>
    <linearGradient id="g" x1="20" y1="10" x2="236" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b6cff"/>
      <stop offset="0.55" stop-color="#b44dff"/>
      <stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
    <radialGradient id="shine" cx="60" cy="30" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="64" fill="url(#g)"/>
  <rect width="256" height="256" rx="64" fill="url(#shine)"/>
  <g fill="#ffffff">
    <rect x="47" y="62" width="26" height="48" rx="13"/>
    <rect x="81" y="62" width="26" height="88" rx="13"/>
    <rect x="115" y="62" width="26" height="134" rx="13"/>
    <rect x="149" y="62" width="26" height="88" rx="13"/>
    <rect x="183" y="62" width="26" height="48" rx="13"/>
  </g>
</svg>
