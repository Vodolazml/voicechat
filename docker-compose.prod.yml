# Production stack for one domain. Set up with: sudo deploy/install.sh <domain> <email>
# Caddy, API and LiveKit use host networking: only ports opened in the firewall are reachable from
# outside, and LiveKit needs a wide UDP port range for media.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: [.env.production]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicechat -d voicechat"]
      interval: 10s
      timeout: 5s
      retries: 10

  data-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - voicechat_data:/data
    command: ["sh", "-c", "mkdir -p /data/downloads /data/files && chown -R 10001:10001 /data"]
    restart: "no"

  api:
    build:
      context: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    env_file: [.env.production]
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "UTF-8"
      VOICECHAT_FILES_DIR: /data/files
    volumes:
      - voicechat_data:/data
      - ./downloads:/data/downloads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    command:
      - python
      - -m
      - uvicorn
      - app.server.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8765"
      - --proxy-headers
      - --forwarded-allow-ips=127.0.0.1
      - --no-server-header

  livekit:
    image: livekit/livekit-server:v1.13.11  # matches the client SDK; 1.9 needed signalling fallbacks
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit.generated.yaml:/etc/livekit.yaml:ro

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    depends_on: [api, livekit]
    env_file: [.env.production]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro  # installers, served by Caddy itself
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  voicechat_data:
  caddy_data:
  caddy_config:
