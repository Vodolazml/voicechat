services:
  data-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - ./.docker-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    restart: "no"
  api:
    depends_on:
      data-init:
        condition: service_completed_successfully
    build:
      context: .
    env_file:
      - .env
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "UTF-8"
      VOICECHAT_DATABASE_URL: "sqlite:////data/voicechat.db"
    ports:
      - "8765:8765"
    volumes:
      - .:/app
      - ./.docker-data:/data
    command: python -m uvicorn app.server.main:app --host 0.0.0.0 --port 8765 --reload
