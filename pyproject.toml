[project]
name = "private-voicechat"
version = "0.2.3"
description = "Private Discord-like desktop voice/text app MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.0",
    "numpy>=1.26",
    "livekit==1.1.18",
    "livekit-api==1.2.1",
    "mss==10.2.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings==2.14.2",
    "PySide6>=6.7.0",
    "sounddevice>=0.4.7",
    "SQLAlchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
